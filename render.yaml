services:
  - type: web
    name: aio-app-api
    runtime: docker
    repo: https://github.com/Leancoggiola/aio-app
    branch: main
    dockerfilePath: Dockerfile
    dockerContext: apps/api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
