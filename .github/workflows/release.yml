name: Release

on:
  push:
    branches: [main, develop]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          BEFORE=$(git tag --list 'v*' | wc -l)
          npx semantic-release
          git fetch --tags origin
          AFTER=$(git tag --list 'v*' | wc -l)
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync develop with main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin
          git checkout develop
          git merge --no-edit origin/main
          git push origin develop

      - name: Deploy API (dev)
        if: steps.release.outputs.new_release == 'true' && github.ref == 'refs/heads/develop'
        run: |
          curl -s "https://api.render.com/deploy/srv-d82jbr83kofs73csd9eg?key=B47dZz6kQH4"

      - name: Deploy API (prod)
        if: steps.release.outputs.new_release == 'true' && github.ref == 'refs/heads/main'
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
